[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trading-core"
version = "0.1.0"
description = "Judgment-safety and decision-scoring layer for LLM-agent trading, extracted from TradingAgents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.50",
    "stockstats>=0.6.5",
    "pydantic>=2.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "anthropic>=2.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["agent_trading_core*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["unit: pure unit test", "integration: needs network"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Upstream TradingAgents deliberately catches Exception at run boundaries (a failed
# cell or reflection must not end a sweep); keep that, and its string-literal style.
ignore = ["BLE001", "ISC004", "RUF013"]
