function perDateAlpha() {
  const resolved = DATA.memory.filter(e => !e.pending && alphaOf(e) != null);
  const avg = a => a.length ? a.reduce((x, e) => x + alphaOf(e), 0) / a.length : null;
  return DATA.summary.dates.map(d => { const rows = resolved.filter(e => e.date === d);
    return { d, n: rows.length, long: avg(rows.filter(e => DIR[e.rating] > 0)), short: avg(rows.filter(e => DIR[e.rating] < 0)) }; });
}
function alphaChart(rows) {
  const W = 520, H = 200, L = 44, R = 12, T = 12, B = 26;
  const vals = rows.flatMap(r => [r.long, r.short]).filter(v => v != null);
  const m = Math.max(0.02, ...vals.map(Math.abs)); const lim = Math.ceil(m * 100 / 2) * 2 / 100;
  const x = i => L + (W - L - R) * (rows.length < 2 ? 0.5 : i / (rows.length - 1));
  const y = v => T + (H - T - B) * (1 - (v + lim) / (2 * lim));
  const ticks = [-lim, -lim / 2, 0, lim / 2, lim];
  const line = (k, c) => { const pts = rows.map((r, i) => r[k] == null ? null : [x(i), y(r[k])]).filter(Boolean);
    const last = pts.at(-1);
    return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p => p.join(",")).join(" ")}"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${c}"/>`).join("")}${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${c}"/>` : ""}`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="결정일별 롱 콜과 숏 콜의 평균 알파">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${(t * 100).toFixed(t === 0 ? 0 : 1)}%</text>`).join("")}
    ${rows.map((r, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${r.d.slice(5).replace("-", "/")}</text>`).join("")}
    ${line("long", "var(--up)")}${line("short", "var(--down)")}</svg>`;
}

function ratingTable(byRating) {
  const order = ["Buy", "Overweight", "Hold", "Underweight", "Sell"].filter(r => byRating[r]);
  if (!order.length) return `<div class="empty">정산된 결정이 없습니다</div>`;
  return `<div class="scroll"><table><thead><tr><th>등급</th><th class="r">n</th><th class="r">방향 적중률</th><th class="r">평균 알파</th><th style="width:40%">평균 알파</th></tr></thead><tbody>
  ${order.map(r => { const s = byRating[r]; const w = Math.min(100, Math.abs(s.mean_alpha) * 1000);
    return `<tr><td><span class="pill ${r}">${r}</span></td><td class="r num">${s.count}</td><td class="r num">${s.hit_rate == null ? "방향 없음" : (s.hit_rate * 100).toFixed(0) + "%"}</td>

}

    ${ex ? `<span class="legend" style="margin:0">결정일 <b class="num">${EX_DATE}</b> · 수동 승인 모드</span>` : `<label>결정일 <select id="decDate">${dates.map(d => `<option ${d === day ? "selected" : ""}>${d}</option>`).join("")}</select></label>`}
  </div>
  <div class="tabs">
    <button data-dectab="all" class="${state.decTab === "all" ? "on" : ""}">결정 <span class="num">${all.length}</span></button>

    <button data-dectab="override" class="${state.decTab === "override" ? "on" : ""}">하드룰 개입 <span class="num">${all.filter(d => d.hard_rule_overrides.length).length}</span></button>

}
function evList(d) {
  return `<div class="ev">${d.evidence.map(e => `<div><span class="src">${esc(e.source)}</span><span>${esc(e.summary)}</span><span class="asof" style="${e.as_of && e.as_of !== d.trade_date ? "color:var(--warn)" : ""}">${esc(e.as_of || "")}</span></div>`).join("")}</div>`;
}
function cardHead(d) {
  return `<div class="hd"><div><span class="tk">${esc(d.ticker)}</span><span class="nm">${esc(name(d.ticker))}</span> ${d.example ? `<span class="ex">예시</span>` : ""}</div>
    <div><span class="pill ${esc(d.rating)}">${d.rating === "REVIEW" ? "⚠ " : ""}${esc(d.rating)}</span> ${d.action ? `<span class="pill Hold">${esc(d.action)}</span>` : ""} <span class="asof">${esc(d.trade_date)}</span></div></div>`;
}
function reasonBadges(d) {
  return (d.sell_reason ? `<span class="reason">매도 사유 · ${esc(d.sell_reason)}</span> ` : "") + (d.sell_reason_hard ? `<span class="reason hard">하드룰 · ${esc(d.sell_reason_hard)}</span>` : "");
}
function decisionCard(d) {
  if (d.rating === "REVIEW") return reviewCard(d);
  const m = memoryByKey[d.ticker + "|" + d.trade_date];
  const canApprove = d.example && d.final && d.final.qty > 0;
  return `<div class="card">${cardHead(d)}
    ${reasonBadges(d) ? `<div>${reasonBadges(d)}</div>` : ""}
    ${d.memo ? `<div class="memo" style="white-space:normal;color:var(--fg)">${esc(d.memo.thesis)}</div>` : `<div class="memo">${esc((d.thesis || "").replace(/\*\*/g, ""))}</div>`}

    <details><summary style="cursor:pointer;font-size:12px;color:var(--fg-2)">증거 ${d.evidence.length}건</summary>${evList(d)}</details>

      ${d.example ? "" : `<span>결과 ${m ? (m.pending ? `<span class="pill pending">정산 대기</span>` : `실현 <b class="num ${cls(rawOf(m))}">${pct(rawOf(m))}</b> · 알파 <b class="num ${cls(alphaOf(m))}">${pct(alphaOf(m))}</b>`) : "기록 없음"}</span>`}
      ${d.hard_rule_overrides.length ? `<span>개입 ${d.hard_rule_overrides.map(o => `<span class="pill REVIEW">${esc(o)}</span>`).join(" ")}</span>` : ""}
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        ${canApprove ? `<button class="btn primary" data-approve="${esc(d.ticker)}">승인</button>` : ""}
        <a href="#ticker" data-ticker="${esc(d.ticker)}">종목 상세 →</a></span></div></div>`;
}
function reviewCard(d) {
  return `<div class="card">${cardHead(d)}
    <p style="margin:0;font-size:13px;color:var(--fg-2)">등급을 읽을 수 없어 거래 대상에서 빠졌습니다. 에이전트 원문 전체:</p>
    <div class="raw">${esc(d.raw || d.thesis || "")}</div>${evList(d)}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="재실행을 요청했습니다">재실행</button><button class="btn" data-act="수동 등급 지정 창을 엽니다">수동 등급 지정</button><button class="btn" data-act="이 결정을 무시 목록에 넣었습니다">무시</button></div></div>`;
}
function overrideCard(d) {
  const p = d.proposal || {}, f = d.final || {};
  const rows = [["action", "방향"], ["position_sizing", "비중"], ["qty", "수량"], ["amount", "예상 금액"]];
  const show = (o, k) => k === "amount" ? fmt(o[k]) + "원" : k === "qty" ? fmt(o[k]) + "주" : esc(o[k] ?? "–");
  return `<div class="card">${cardHead(d)}
    <div>${d.hard_rule_overrides.map(o => `<span class="pill REVIEW" style="font-family:var(--font-mono);font-weight:500">${esc(o)}</span>`).join(" ")} ${reasonBadges(d)}</div>
    <div class="cmp"><div class="h">원안 (에이전트)</div><div class="h">최종 (룰 적용 후)</div>
      ${rows.map(([k, l]) => { const chg = String(p[k]) !== String(f[k]); return `<div class="${chg ? "chg" : ""}"><small style="color:var(--fg-3)">${l}</small><br><span class="num">${show(p, k)}</span></div><div class="${chg ? "chg" : ""}"><small style="color:var(--fg-3)">${l}</small><br><span class="num">${show(f, k)}</span></div>`; }).join("")}
    </div><p class="legend" style="margin:0">강조된 행이 룰 레이어가 바꾼 필드입니다.</p></div>`;
}
function openApprove(t) {
  const d = EXAMPLES.find(x => x.ticker === t); const f = d.final;
  $("#modalBox").innerHTML = `<h2 id="modalTitle" style="margin:0">주문 승인 <span class="ex">예시</span></h2>
    <dl><dt>종목</dt><dd><b>${esc(d.ticker)}</b> ${esc(name(d.ticker))}</dd><dt>방향</dt><dd><span class="pill ${d.action === "Sell" ? "Sell" : "Buy"}">${esc(f.action)}</span></dd>

    <dt>적용된 룰</dt><dd>${d.hard_rule_overrides.length ? d.hard_rule_overrides.map(esc).join("<br>") : "없음"}</dd></dl>
    <p class="legend" style="margin:0">확인하면 실행 레이어로 주문이 전달되고 감사 로그에 승인자가 남습니다.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mOk">확인 후 전달</button></div>`;
  $("#modal").hidden = false; $("#mOk").focus();

function closeModal() { $("#modal").hidden = true; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

  return `<div class="card">${cardHead(d)}
    <dl class="memo-sec">
      <dt>사업 요약</dt><dd>${esc(m.business)}</dd>
      <dt>논지</dt><dd>${esc(m.thesis)}</dd>
      <dt>불 케이스</dt><dd>${esc(m.bull)}</dd>
      <dt>베어 케이스</dt><dd>${esc(m.bear)}</dd>
      <dt>밸류에이션</dt><dd><div class="val3"><div><small>현재가</small><b class="num">${fmt(v.price)}</b></div><div><small>목표가</small><b class="num pos">${fmt(v.target)}</b> <span class="num pos">${pct(up)}</span></div><div><small>하락가</small><b class="num neg">${fmt(v.downside)}</b> <span class="num neg">${pct(dn)}</span></div></div>
        <span class="legend">reward/risk <b class="num">${(up / -dn).toFixed(1)}</b></span></dd>
      <dt>촉매</dt><dd><ul>${m.catalysts.map(([e, w]) => `<li>${esc(e)} <span class="asof">${esc(w)}</span></li>`).join("")}</ul></dd>

      <dt>등급·확신도·비중</dt><dd><span class="pill ${esc(d.rating)}">${esc(d.rating)}</span> 확신도 <b class="num">${d.confidence.toFixed(2)}</b> · ${esc(m.sizing)}</dd>
      <dt>매도 계획</dt><dd>${esc(m.exit_plan)}</dd>
      <dt>기간</dt><dd>${esc(m.horizon)}</dd>

      <div style="margin-top:6px">${d.hard_rule_overrides.map(o => `<span class="pill REVIEW">${esc(o)}</span>`).join(" ")}</div></details></div>`;

function holdingDetail(p) {

  ${POSITIONS.map(([t, q, avg, cur, stop, peak, days, exp]) => { const u = cur / avg - 1, gap = cur / stop - 1;
    return `<tr class="click" data-ticker="${t}"><td><b>${t}</b> <span style="color:var(--fg-2)">${esc(name(t))}</span></td><td class="r num">${fmt(q)}</td><td class="r num">${fmt(avg)}</td><td class="r num">${fmt(cur)}</td>
    <td class="r num ${cls(u)}">${pct(u)}</td><td class="r num">${fmt(stop)}</td><td class="r num" style="${gap < 0.02 ? "color:var(--up);font-weight:700" : ""}">${gap < 0.02 ? "⚠ " : ""}${pct(gap)}</td><td class="r num">${fmt(peak)}</td><td class="r num">${days}</td><td class="num">${exp}</td></tr>`; }).join("")}
  </tbody></table></div><p class="legend">손절까지 2% 미만이면 경고로 표시합니다. 051910.KS는 오늘 결정 큐에서 매도(논지 깨짐)가 나와 승인 대기 중입니다.</p></div>
  <div class="grid row2" style="margin-top:14px">
    <div class="panel"><h2>리스크 게이지</h2>
      ${gauge("드로다운", 0.034, 0.10, "피크 대비")}${gauge("그로스 노출", 0.35, 1.0, "자본 대비")}
      <h2 style="margin-top:14px">섹터 노출 vs 한도 20%</h2>
      ${SECTORS.filter(s => s[0] !== "현금").map(([s, v]) => gauge(s, v, 0.20, "")).join("")}
      <p class="legend">검은 세로선이 한도입니다. 반도체는 한도에 닿아 000660.KS 신규 매수가 4%로 줄었습니다.</p></div>
    <div class="panel"><h2>청산 사유 분포 <span class="asof">최근 ${total}건</span></h2>
      <div class="stack" role="img" aria-label="청산 사유 분포">${EXITS.filter(e => e[1]).map(([k, n, c]) => `<i style="width:${n / total * 100}%;background:${c}" title="${k} ${n}"></i>`).join("")}</div>
      <table style="margin-top:10px"><tbody>${EXITS.map(([k, n, c]) => `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:6px"></span><span class="num">${k}</span></td><td class="r num">${n}</td><td class="r num" style="color:var(--fg-3)">${(n / total * 100).toFixed(0)}%</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>Protections</h2><div class="prot">
    ${PROTECTIONS.map(p => `<div class="${p.on ? "on" : ""}"><div style="display:flex;justify-content:space-between;gap:8px"><b class="num">${p.k}</b><span class="st ${p.on ? "on" : "ok"}">${p.on ? "● 발동" : "○ 정상"}</span></div>
      <span style="color:var(--fg-2)">${esc(p.why)}</span><span class="legend" style="margin:0">해제 ${esc(p.until)} · lookback 내 트리거 ${p.n}건</span></div>`).join("")}
  </div></div>`;
}
function gauge(label, v, lim, unit) {
  const max = Math.max(lim * 1.25, v * 1.1), over = v >= lim;
  return `<div class="gauge"><span>${esc(label)}</span><div class="bar" role="img" aria-label="${esc(label)} ${(v * 100).toFixed(1)}%, 한도 ${(lim * 100).toFixed(0)}%"><i style="left:0;width:${v / max * 100}%;background:${over ? "var(--up)" : "var(--accent)"}"></i><i class="lim" style="left:${lim / max * 100}%"></i></div>
    <span class="num r" style="text-align:right;${over ? "color:var(--up);font-weight:700" : ""}">${(v * 100).toFixed(1)}% <small style="color:var(--fg-3)">/ ${(lim * 100).toFixed(0)}%</small></span></div>`;
}

/* ---------- 7 config ---------- */
function viewConfig() {
  const s = latest, thr = {};
  s.candidates.forEach(c => c.filters.forEach(f => { if (thr[f.rule] == null && f.threshold != null) thr[f.rule] = f.threshold; }));
  const dset = decisions[0]?.settings || {};
  const newest = Math.max(...DATA.cache.map(c => c.mtime));
  const ago = ts => { const h = (newest - ts) / 3600; return h < 1 ? "최신" : h.toFixed(0) + "시간 전"; };
  return `<h1>설정·감사 로그</h1><p class="sub">선별·하드룰·실행 규칙의 현재 파라미터와 모든 변경 기록. 규칙 변경은 관리자만 할 수 있고, 변경은 지워지지 않는 기록으로 남습니다.</p>
  <div class="panel"><h2>규칙 레지스트리 <span class="asof">${esc(s.as_of)} 실행 기준</span></h2><div class="scroll"><table><thead><tr><th>규칙</th><th>설명</th><th class="r">현재 파라미터</th><th>레이어</th><th>마지막 변경</th></tr></thead><tbody>
    ${s.rules.map(r => { const h = HISTORY.find(x => x[2] === r); return `<tr><td><b>${esc(RULE_LABEL[r] || r)}</b> <span class="num" style="color:var(--fg-3)">${esc(r)}</span></td><td style="white-space:normal">${esc(RULE_DESC[r] || "")}</td><td class="r num">${esc(thr[r] ?? "–")}</td><td>선별</td><td>${h ? `<span class="num">${h[0].slice(0, 10)}</span> ${esc(h[1])} <span class="ex">예시</span>` : `<span style="color:var(--fg-3)">초기값</span>`}</td></tr>`; }).join("")}
    <tr><td><b>종목 비중 한도</b> <span class="num" style="color:var(--fg-3)">max_position_pct</span></td><td style="white-space:normal">한 종목 비중 상한</td><td class="r num">6%</td><td>하드룰</td><td><span class="num">2026-07-08</span> 관리자 <span class="ex">예시</span></td></tr>
    <tr><td><b>섹터 한도</b> <span class="num" style="color:var(--fg-3)">sector_cap</span></td><td style="white-space:normal">섹터 합계 비중 상한</td><td class="r num">20%</td><td>하드룰</td><td><span style="color:var(--fg-3)">초기값</span> <span class="ex">예시</span></td></tr>
  </tbody></table></div></div>
  <div class="grid row2" style="margin-top:14px">
    <div class="panel"><h2>모델 설정 <span class="asof">DecisionRecord.settings</span></h2><table><tbody>
      ${Object.entries(dset).map(([k, v]) => `<tr><td class="num" style="color:var(--fg-3)">${esc(k)}</td><td style="white-space:normal">${esc(v)}</td></tr>`).join("")}
      <tr><td class="num" style="color:var(--fg-3)">quick_think_llm / deep_think_llm</td><td>미연결 <span class="legend">LLM 에이전트 연결 시 표시</span></td></tr>
    </tbody></table></div>
    <div class="panel"><h2>데이터·캐시 상태</h2><p class="legend" style="margin-top:0">캐시 ${DATA.cache.length}개 · ${fmt(DATA.cache.reduce((a, c) => a + c.kb, 0))} KB · 벤더 yfinance</p>
      <div class="scroll" style="max-height:260px"><table><thead><tr><th>심볼</th><th class="r">크기</th><th>마지막 다운로드</th></tr></thead><tbody>
      ${DATA.cache.map(c => `<tr><td class="num">${esc(c.file.replace("-YFin-data.csv", ""))}</td><td class="r num">${fmt(c.kb)} KB</td><td class="num">${new Date(c.mtime * 1000).toISOString().slice(0, 16).replace("T", " ")} <span style="color:var(--fg-3)">${ago(c.mtime)}</span></td></tr>`).join("")}
      </tbody></table></div></div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>변경 이력 <span class="ex">예시</span></h2><div class="scroll"><table><thead><tr><th>시각</th><th>변경자</th><th>대상</th><th>변경</th><th>사유</th></tr></thead><tbody>
    ${HISTORY.map(h => `<tr><td class="num">${h[0]}</td><td>${esc(h[1])}</td><td class="num">${esc(h[2])}</td><td class="num">${esc(h[3])}</td><td>${esc(h[4])}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

/* ---------- 6 performance ---------- */
function viewPerformance() {
  const s = DATA.summary;
  const resolved = DATA.memory.filter(e => !e.pending && alphaOf(e) != null);
  const dates = s.dates;
  const perDate = dates.map(d => { const rows = resolved.filter(e => e.date === d); const long = rows.filter(e => DIR[e.rating] > 0), short = rows.filter(e => DIR[e.rating] < 0);
    const avg = a => a.length ? a.reduce((x, e) => x + alphaOf(e), 0) / a.length : null; return { d, n: rows.length, long: avg(long), short: avg(short) }; });
  const refl = DATA.memory.filter(e => !e.pending && e.reflection).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  return `<h1>성과·백테스트</h1><p class="sub">실행 <b class="num">${esc(s.run_id)}</b>: ${esc(DATA.generated_from.universe.length)}종목 × ${dates.length}일 = ${esc(s.cells_run)}셀. 규칙 전용 베이스라인이라 LLM이 더하는 알파를 재는 기준선입니다.</p>
  <div class="grid kpis"><div class="tile"><div class="lab">정산 완료</div><div class="val num">${s.resolved}</div></div><div class="tile"><div class="lab">대기</div><div class="val num">${s.pending}</div></div>
    <div class="tile"><div class="lab">미채점(REVIEW)</div><div class="val num">${s.unscored}</div></div><div class="tile"><div class="lab">보유기간</div><div class="val" style="font-size:16px">${esc(s.holding)}</div></div></div>
  <div class="panel" style="margin-top:14px"><h2>등급별 성과</h2>${ratingTable(s.by_rating)}</div>
  <div class="panel" style="margin-top:14px"><h2>결정일별 평균 알파 (롱 콜 vs 숏 콜)</h2>
    <div class="scroll"><table><thead><tr><th>결정일</th><th class="r">정산 n</th><th class="r">Buy/OW 평균 알파</th><th class="r">Sell/UW 평균 알파</th><th style="width:40%"></th></tr></thead><tbody>
    ${perDate.map(r => `<tr><td class="num">${r.d}</td><td class="r num">${r.n}</td><td class="r num ${cls(r.long)}">${pct(r.long, 2)}</td><td class="r num ${cls(r.short)}">${pct(r.short, 2)}</td>
      <td><div class="bar">${r.long != null ? `<i style="${r.long >= 0 ? "left:50%" : "right:50%"};width:${Math.min(50, Math.abs(r.long) * 500)}%;background:var(--up);opacity:.8"></i>` : ""}${r.short != null ? `<i style="${r.short >= 0 ? "left:50%" : "right:50%"};width:${Math.min(50, Math.abs(r.short) * 500)}%;background:var(--down);opacity:.5;top:4px"></i>` : ""}<i style="left:50%;width:1px;background:var(--line)"></i></div></td></tr>`).join("")}
    </tbody></table></div><p class="legend">숏 콜(Sell/Underweight)은 알파가 음수일 때 적중입니다. 막대는 ±10% 스케일.</p></div>
  <div class="panel" style="margin-top:14px"><h2>반성 피드</h2>${refl.map(e => `<div style="display:grid;grid-template-columns:auto auto 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span class="num">${esc(e.date)} ${esc(e.ticker)}</span><span class="pill ${esc(e.rating)}">${esc(e.rating)}</span><span style="color:var(--fg-2)">${esc(e.reflection)}</span></div>`).join("")}
    <p class="legend">베이스라인에는 LLM 반성이 없어 수치만 적힙니다. 에이전트 연결 후에는 2~4문장 교훈이 들어오고 다음 판단 프롬프트에 주입됩니다.</p></div>
  <div class="note">알파는 결정일 다음 첫 종가 진입 기준 ${esc(s.holding)}, 벤치마크는 종목 접미사별 지수(.KS → KOSPI). 모델 샘플링 없이 규칙만 돌렸으므로 이 run은 재현 가능하지만, 뉴스·소셜 피드가 들어가는 에이전트 run은 재현값이 아닙니다.</div>`;
}

function viewStub(title, items) {
  return `<h1>${title}</h1><p class="sub">이 화면은 실행 레이어·하드 룰 레이어가 연결되면 채워집니다. 기획서 2차 범위.</p>
  <div class="grid row2">${items.map(([h, d]) => `<div class="panel"><h2>${h}</h2><p style="color:var(--fg-2);margin:0">${d}</p></div>`).join("")}</div>`;
}

function render() {
  nav();
  const main = $("#main");
  let html = statusbar();
  switch (state.view) {
    case "screens": html += viewScreens(); break;
    case "decisions": html += viewDecisions(); break;
    case "ticker": html += viewTicker(); break;
    case "performance": html += viewPerformance(); break;
    case "positions": html += viewPositions(); break;
    case "config": html += viewConfig(); break;
    default: html += viewHome();
  }
  main.innerHTML = html;
  main.querySelectorAll("tr.click[data-ticker], a[data-ticker]").forEach(el => el.addEventListener("click", ev => { ev.preventDefault(); state.ticker = el.dataset.ticker; state.tab = "decisions"; go("ticker"); }));
  main.querySelectorAll("tr.click[data-screen]").forEach(el => el.addEventListener("click", () => { state.screenIdx = +el.dataset.screen; state.stage = null; state.filter = "all"; state.q = ""; render(); }));
  main.querySelectorAll(".stage").forEach(el => el.addEventListener("click", () => { state.stage = el.dataset.stage === "all" ? null : +el.dataset.stage; render(); }));
  main.querySelectorAll("[data-filter]").forEach(el => el.addEventListener("click", () => { state.filter = el.dataset.filter; render(); }));
  main.querySelectorAll("[data-decsrc]").forEach(el => el.addEventListener("click", () => { state.decSrc = el.dataset.decsrc; render(); }));
  main.querySelectorAll("[data-approve]").forEach(el => el.addEventListener("click", () => openApprove(el.dataset.approve)));
  main.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", () => toast(el.dataset.act + " (시안)")));
  main.querySelectorAll("[data-dectab]").forEach(el => el.addEventListener("click", () => { state.decTab = el.dataset.dectab; render(); }));
  main.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", () => { state.tab = el.dataset.tab; render(); }));
  const q = $("#q"); if (q) q.addEventListener("input", () => { state.q = q.value; const pos = q.selectionStart; render(); const q2 = $("#q"); q2.focus(); q2.setSelectionRange(pos, pos); });
  const dd = $("#decDate"); if (dd) dd.addEventListener("change", () => { state.decDate = dd.value; render(); });
  const ts = $("#tickerSel"); if (ts) ts.addEventListener("change", () => { state.ticker = ts.value; render(); });
  const back = $("#back"); if (back) back.addEventListener("click", ev => { ev.preventDefault(); state.screenIdx = null; render(); });
}
function go(view) { state.view = view; if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view); render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (SCREENS.some(s => s[0] === v)) { state.view = v; if (v === "screens") state.screenIdx = null; render(); } });
(function start() {
  const v = location.hash.slice(1);
  if (SCREENS.some(s => s[0] === v)) state.view = v;
  if (!DATA) { $("#main").innerHTML = `<div class="empty">데이터가 주입되지 않았습니다. scripts/build_mockup.py를 실행하세요.</div>`; return; }
  render();
})();
</script>
